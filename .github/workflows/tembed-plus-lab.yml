name: T-Embed Plus lab profile

# Not yet run on GitHub: written alongside the first local build (Windows).
# The local equivalents are in docs/tembed-plus/RELEASE_GUIDE.md.

on:
  push:
    branches: [tembed-plus/**]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Decoder host tests (gcc, ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/subghz_ws/run.py

  firmware:
    name: Build and check the image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build (fails if the SDK is modified or excluded code is linked)
        env:
          ESP_IDF_DIR: /opt/esp/idf
          IDF_TOOLS_PATH: /opt/esp
        run: python3 tools/tembed_plus/build.py build
      - name: SD bundle decisions
        run: python3 tools/tembed_plus/make_sd_bundle.py --list | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: tembed-plus-lab-firmware
          path: |
            build_t_embed_plus/furi_esp32.bin
            build_t_embed_plus/bootloader/bootloader.bin
            build_t_embed_plus/partition_table/partition-table.bin
            build_t_embed_plus/ota_data_initial.bin
            build_t_embed_plus/flash_args
